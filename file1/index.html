
<!DOCTYPE html>
<html>
<head>
    <title>Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- <h1>grid</h1> -->

        <div class="main-grid">

            <!-- Left Section -->
            <div class="left-section">

                <div class="top-images">
                    <img src="https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=500" alt="Grapes">

                    <img src="https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=500" alt="Strawberries">
                </div>

                <div class="grapefruit">
                    <img src="https://images.unsplash.com/photo-1577234286642-fc512a5f8f11?w=800" alt="Grapefruit">
                </div>

                <div class="papaya">
                    <img src="https://images.unsplash.com/photo-1517282009859-f000ec3b26fe?w=800" alt="Papaya">
                </div>

            </div>

            <!-- Right Section -->
            <div class="right-section">

                <div class="watermelon">
                    <img src="https://images.unsplash.com/photo-1563114773-84221bd62daa?w=800" alt="Watermelon">
                </div>

                <div class="pineapple">
                    <img src="https://images.unsplash.com/photo-1550258987-190a2d41a8ba?w=800" alt="Pineapple">
                </div>

            </div>

        </div>

</html>
